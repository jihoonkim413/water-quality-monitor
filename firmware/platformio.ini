[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv  ; two 1.9 MB app slots for WiFi updates

; Firmware updates over WiFi. Flash once over USB first, then:
;   pio run -e ota -t upload
; The device address and password live in local.ini (not committed; copy local.example.ini).
[platformio]
extra_configs = local.ini

[env:ota]
extends = env:esp32dev
upload_protocol = espota
